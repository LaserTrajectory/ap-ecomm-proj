{% extends "base/base.html" %}

{% block content %}

    <h2>Profile</h2>

    <div class="logged-in-box auth0-box logged-in">
        <img class="avatar mt-3" src="{{ auth0User.extra_data.picture }}"/>
        <h2 class="mt-3">Welcome {{ user_profile_obj.display_name }}</h2>
        <p>Delivery address: {{ user_profile_obj.delivery_address }}</p>

        <a class="btn btn-warning btn-lg btn-logout btn-block mt-3" href="{% url 'base:edit-profile' %}">Edit your profile details</a>

        <a class="btn btn-primary btn-lg btn-logout btn-block mt-3" href="/logout">Logout</a>
        
    </div>
    
{% endblock content %}
